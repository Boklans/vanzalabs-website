<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Vibrant Electric Blue to Royal Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Document Subtle Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- V-Monogram Gradient -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Green Approved Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="docShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Main Invoice Document Sheet -->
  <g filter="url(#docShadow)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M 125 90 
             L 315 90 
             L 387 162 
             L 387 422 
             A 16 16 0 0 1 371 438 
             L 141 438 
             A 16 16 0 0 1 125 422 
             Z" 
          fill="url(#docGrad)" />

    <!-- Document Fold -->
    <path d="M 315 90 L 315 146 A 16 16 0 0 0 331 162 L 387 162 Z" fill="url(#foldGrad)" />
  </g>

  <!-- Document Header Bar -->
  <rect x="165" y="145" width="130" height="20" rx="10" fill="#2563eb" />

  <!-- Minimalist Invoice Line Items -->
  <rect x="165" y="195" width="180" height="12" rx="6" fill="#cbd5e1" />
  <rect x="165" y="225" width="140" height="12" rx="6" fill="#e2e8f0" />

  <!-- Bold Vanza "V" Monogram in Center -->
  <path d="M 195 270 
           L 242 375 
           A 16 16 0 0 0 270 375 
           L 317 270 
           L 282 270 
           L 256 335 
           L 230 270 
           Z" 
        fill="url(#vGrad)" />

  <!-- Green "Approved / Paid" Badge with White Checkmark -->
  <g filter="url(#badgeShadow)">
    <circle cx="370" cy="405" r="56" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- White Checkmark -->
    <path d="M 346 404 L 364 422 L 396 388" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
